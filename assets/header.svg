<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160">
  <rect width="720" height="160" fill="#0D1117"/>
  <!-- community circles -->
  <g fill="none" stroke="#3FB950" stroke-width="1.5">
    <circle cx="120" cy="80" r="20" opacity="0.9"/>
    <circle cx="120" cy="80" r="36" opacity="0.5">
      <animate attributeName="r" values="36;48;36" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="80" r="52" opacity="0.25">
      <animate attributeName="r" values="52;68;52" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="120" cy="80" r="8" fill="#3FB950"/>
  <g font-family="ui-monospace,Menlo,monospace">
    <text x="200" y="60" font-size="18" fill="#E6EDF3">OBOMOCARE</text>
    <text x="200" y="90" font-size="12" fill="#8B949E">Kisii Â· Nyamira Â· diaspora</text>
    <text x="200" y="115" font-size="12" fill="#3FB950">programs Â· stories Â· community</text>
  </g>
  <!-- pulse nodes -->
  <circle cx="480" cy="50" r="3" fill="#1F6FEB"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="90" r="3" fill="#3FB950"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="55" r="3" fill="#1F6FEB"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="100" r="3" fill="#3FB950"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
</svg>
